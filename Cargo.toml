[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
mc-core = { path = "crates/mc-core" }
mc-jobs = { path = "crates/mc-jobs" }
mc-map = { path = "crates/mc-map" }
mc-path = { path = "crates/mc-path" }
mc-sim = { path = "crates/mc-sim" }
mc-data = { path = "crates/mc-data" }
mc-net = { path = "crates/mc-net" }
mc-render = { path = "crates/mc-render" }

ash = "0.38"
winit = "0.30"
raw-window-handle = "0.6"
ash-window = "0.13"
font8x8 = "0.3"
fontdue = "0.9"
cpal = "0.15"
naga = { version = "30", features = ["wgsl-in", "spv-out"] }
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.33", features = ["bytemuck"] }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
bincode = "1.3"
png = "0.18"
log = "0.4"
env_logger = "0.11"

# The sim is integer-only, but keep debug builds usable at full entity counts.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = 1
