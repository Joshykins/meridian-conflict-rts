# The gate (scripts/check.sh: rustfmt, clippy with warnings as errors, every
# test) on every push to the three branches and every pull request into them.
# Sessions land on dev locally, already checked; this catches what slipped by
# and checks work that arrives by pull request. Builds are published from the
# user's machine (scripts/channel.sh promote), not here (docs/RELEASES.md).
name: check

on:
  push:
    branches: [dev, playtest, release]
  pull_request:
    branches: [dev, playtest, release]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the compiler; rustup installs it on first use.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          # The gate profile builds the tests; clippy builds debug.
          cache-directories: target/gate
          save-if: ${{ github.event_name == 'push' }}
      - name: scripts/check.sh
        env:
          # A hosted runner has four cores: fewer test binaries at once, and
          # more time before one counts as hung.
          MERIDIAN_TEST_JOBS: "3"
          MERIDIAN_TEST_LIMIT: "600"
        run: scripts/check.sh
