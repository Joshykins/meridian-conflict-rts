[package]
name = "mc-launcher"
version.workspace = true
edition.workspace = true
publish.workspace = true

# What players start: a window that keeps the game up to date, shows its patch
# notes and news, and runs the installed build, or an old build for an old
# replay (docs/RELEASES.md).
[[bin]]
name = "MeridianConflict"
path = "src/main.rs"

[dependencies]
mc-core = { workspace = true }
mc-net = { workspace = true }
mc-builds = { workspace = true }
winit = { workspace = true }
softbuffer = { workspace = true }
tiny-skia = { workspace = true }
fontdue = { workspace = true }
png = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
embed-resource = { workspace = true }

[lints]
workspace = true
