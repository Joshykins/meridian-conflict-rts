[package]
name = "mc-studio"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The music studio: a DAW for writing and tuning the game's songs
# (`data/music/*.ron`) while they play through the same engine the game uses.

[[bin]]
name = "mc-studio"
path = "src/main.rs"

[dependencies]
mc-music = { workspace = true }
# The game's sounds, made by the game's own synthesiser, for the Sounds screen.
mc-data = { workspace = true }
mc-sfx = { workspace = true }
# Decoding reference recordings and hearing humming as notes. On by default;
# `--no-default-features` builds without it (WAV references only, no humming).
mc-listen = { workspace = true, optional = true }
eframe = { workspace = true, features = ["glow", "default_fonts", "x11", "wayland"] }
png = { workspace = true }
ron = { workspace = true }
serde = { workspace = true }

# Sound and MIDI need system APIs. Windows and macOS ship them; on Linux both
# link ALSA, whose headers are not always installed, so they are opt-in there
# (`--features alsa`) and the studio runs silent without them.
cpal = { workspace = true, optional = true }
midir = { workspace = true, optional = true }

[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = { workspace = true }
midir = { workspace = true }

[features]
default = ["listen"]
listen = ["dep:mc-listen"]
alsa = ["dep:cpal", "dep:midir"]

[lints]
workspace = true
